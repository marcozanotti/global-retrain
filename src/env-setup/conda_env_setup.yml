# Conda Environment Setup Instructions ----
#  - Using an environment.yml file with conda
#  - Key Terminal Commands:
#
#    conda env create -f src/env-setup/conda_env_setup.yml
#    conda env update --file src/env-setup/conda_env_setup.yml --prune
#    conda env export --name global_retrain > envname.yml
#    conda env remove --name global_retrain
#    conda env list

name: global_retrain
channels:
  - conda-forge
  - defaults
  - pytorch
dependencies:
  - python=3.11.9
  - pip 
  - pip:

      # Core Data
      - numpy >= 1.24.0, < 2.0.0
      - pandas >= 2.2.0, < 3.0.0
      - pyarrow
      - fastparquet
      - polars >= 1.6.0, < 2.0.0

      # Time Series
      - pytimetk >= 2.0.0, < 3.0.0
      
      # Machine Learning
      - scikit-learn >= 1.5.0, < 2.0.0
      - xgboost >= 2.1.0, < 3.0.0
      - lightgbm >= 4.5.0, < 5.0.0
      - catboost >= 1.2.0, < 2.0.0

      # Optimization
      - optuna >= 4.0.0, < 5.0.0

      # Nixtla-verse
      - datasetsforecast
      - coreforecast
      - utilsforecast
      - statsforecast >= 2.0.0, < 3.0.0 
      - mlforecast >= 1.0.0, < 2.0.0
      - neuralforecast >= 3.0.0, < 4.0.0

      # Notebooks
      - ipykernel
      - jupyterlab
      - jupyterlab-server
      - ipywidgets
      - ipympl
      - jupytext
