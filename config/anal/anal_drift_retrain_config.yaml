analysis: {
    'name': 'drift_retrain',
    'types': [
        'evaluation', 
        # 'evaluation_prepost',
        # 'stability', 
        'time', 
        'cost'
    ],
    'method': 'absolute', # absolute / relative # run twice, one for absolute and one for relative
    'sample_type': 'overlap' # overlap / nooverlap
}

dataset: {
    'dataset_names': ['hapag_region'],
    'frequencies': ['weekly'],
    'ext': '.parquet'
}

models: {
    'types': [['SF'], ['ML', 'DL']], # ML and DL together
    'model_names': [
        'Naive',
        'SeasonalNaive',
        'WindowAverage',
        'ETS',
        'ARIMA',
        'LinearRegression', 
        'XGBRegressor',
        'LGBMRegressor', 
        # 'MLP',
        # 'NBEATSx'
    ],
    'model_names_abbr': [
        'Naive',
        'SeasonalNaive',
        'MA',
        'ETS',
        'ARIMA',
        'LR', 
        'XGBoost', 
        'LGBM',
        # 'MLP',
        # 'NBEATSx'
    ]
}

evaluation_params: {
    'metrics': ['rmsse', 'scaled_mqloss'],
    'outlier_cleaning_metrics': null, # ['rmsse', 'scaled_mqloss'],
    'outlier_cleaning_quantiles': null # [0.000, 1]
}

time_params: {
    'metrics': ['total_fit_time', 'total_predict_time', 'total_sample_time']
}

stability_params: {
    'metrics': ['smapc', 'smqpc'],
    'outlier_cleaning_metrics': null, # ['smapc', 'smqpc'],
    'outlier_cleaning_quantiles': null # [0.000, 1]
}

cost_params: {
    'metrics': ['cost', 'savings', 'savings_perc'],
    'time_var': 'total_sample_time',
    'n_skus': 89236, # 12748 porto-to-port connections * 7 container types
    'cost_datasets_n_skus': ['hapag_region_weekly': 657],
    'cost_per_hour': [1, 3.5], # cost of machines for SF models first
    'adjust_time_for_sf': True, # adjust value with: total_fit_time / n_skus_sf * n_skus / n_cores,
    'n_skus_sf': 657, # number of time series used in sf experiments
    'n_cores': 16 # number of cores
}

